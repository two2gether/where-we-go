name: Optimized Deploy to AWS ECS

on:
  push:
    branches: [ main, feat/frontend-improvements-clean ]  # 테스트용 브랜치 추가
  pull_request:
    branches: [ main ]
    types: [ closed ]  # PR이 머지되었을 때만

env:
  AWS_REGION: ap-northeast-2
  ECR_REPOSITORY: wherewego-app
  CONTAINER_NAME: wherewego-app

permissions:
  id-token: write
  contents: read

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.changes.outputs.backend }}
      frontend: ${{ steps.changes.outputs.frontend }}
      any-changes: ${{ steps.changes.outputs.any-changes }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Detect changes
        id: changes
        run: |
          echo "🔍 변경사항 감지 시작..."
          
          # Backend 변경 감지 (더 정밀하게)
          if git diff --name-only HEAD~1 HEAD | grep -E "(src/|build.gradle|Dockerfile|aws/task-definition.json)" > /dev/null; then
            echo "✅ Backend 변경사항 감지됨"
            echo "backend=true" >> $GITHUB_OUTPUT
          else
            echo "⏭️ Backend 변경사항 없음"
            echo "backend=false" >> $GITHUB_OUTPUT
          fi
          
          # Frontend 변경 감지
          if git diff --name-only HEAD~1 HEAD | grep -E "frontend/" > /dev/null; then
            echo "✅ Frontend 변경사항 감지됨"
            echo "frontend=true" >> $GITHUB_OUTPUT
          else
            echo "⏭️ Frontend 변경사항 없음"
            echo "frontend=false" >> $GITHUB_OUTPUT
          fi
          
          # 전체 변경사항 확인
          if git diff --name-only HEAD~1 HEAD | grep -E "(src/|build.gradle|Dockerfile|aws/task-definition.json|frontend/)" > /dev/null; then
            echo "any-changes=true" >> $GITHUB_OUTPUT
          else
            echo "any-changes=false" >> $GITHUB_OUTPUT
          fi

      - name: Show detection results
        run: |
          echo "📊 변경사항 감지 결과:"
          echo "Backend: ${{ steps.changes.outputs.backend }}"
          echo "Frontend: ${{ steps.changes.outputs.frontend }}"
          echo "Any changes: ${{ steps.changes.outputs.any-changes }}"

  build:
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.any-changes == 'true'
    outputs:
      image-uri: ${{ steps.build-image.outputs.image }}
      environment: ${{ steps.set-env.outputs.environment }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Notify build start
        if: needs.detect-changes.outputs.any-changes == 'true'
        run: |
          if [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            ENV_ICON="🚀"; ENV_NAME="Production"
          else
            ENV_ICON="🧪"; ENV_NAME="Development"
          fi
          
          CHANGES=""
          [[ "${{ needs.detect-changes.outputs.backend }}" == "true" ]] && CHANGES="${CHANGES}🔧 Backend "
          [[ "${{ needs.detect-changes.outputs.frontend }}" == "true" ]] && CHANGES="${CHANGES}🎨 Frontend "
          
          curl -X POST -H 'Content-type: application/json' \
          --data "{\"text\": \"$ENV_ICON *WhereWeGo 최적화 빌드 시작* 🔨\\n변경사항: $CHANGES\"}" \
          ${{ secrets.SLACK_WEBHOOK }} || echo "Slack notification failed"

      - name: Set environment variables
        id: set-env
        run: |
          if [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            echo "environment=prod" >> $GITHUB_OUTPUT
          else
            echo "environment=prod" >> $GITHUB_OUTPUT
          fi

      - name: Set up JDK 17
        if: needs.detect-changes.outputs.backend == 'true'
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Node.js
        if: needs.detect-changes.outputs.frontend == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Grant execute permission for gradlew
        if: needs.detect-changes.outputs.backend == 'true'
        run: chmod +x gradlew

      - name: Build Frontend (conditional)
        if: needs.detect-changes.outputs.frontend == 'true'
        run: |
          echo "🎨 프론트엔드 빌드 중..."
          cd frontend && npm ci && npm run build && cd ..

      - name: Build with Gradle (conditional)
        if: needs.detect-changes.outputs.backend == 'true'
        run: |
          echo "⚙️ Gradle 빌드 중..."
          ./gradlew clean build -x test

      - name: Configure AWS credentials
        if: needs.detect-changes.outputs.backend == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          role-session-name: GitHubActions-Build
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        if: needs.detect-changes.outputs.backend == 'true'
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push Docker image (conditional)
        if: needs.detect-changes.outputs.backend == 'true'
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          echo "🐳 Docker 이미지 빌드 중..."
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          
          docker tag $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG $ECR_REGISTRY/$ECR_REPOSITORY:latest
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest
          
          echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT

      - name: Cleanup old ECR images (conditional)
        if: needs.detect-changes.outputs.backend == 'true'
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          echo "🧹 ECR 이미지 정리..."
          IMAGE_TAGS=$(aws ecr describe-images \
            --repository-name $ECR_REPOSITORY \
            --query 'sort_by(imageDetails[?imageTags && imageTags[0] != `latest`], &imagePushedAt)[*].imageTags[0]' \
            --output text 2>/dev/null || echo "")
          
          TAGS_ARRAY=($IMAGE_TAGS)
          TOTAL_IMAGES=${#TAGS_ARRAY[@]}
          
          if [ $TOTAL_IMAGES -gt 3 ]; then
            DELETE_COUNT=$((TOTAL_IMAGES - 3))
            for (( i=0; i<$DELETE_COUNT; i++ )); do
              aws ecr batch-delete-image \
                --repository-name $ECR_REPOSITORY \
                --image-ids imageTag=${TAGS_ARRAY[$i]} || echo "⚠️ 삭제 실패"
            done
            echo "✅ 최신 3개 이미지 + latest 유지"
          fi

  backend-deploy:
    runs-on: ubuntu-latest
    needs: [detect-changes, build]
    if: needs.detect-changes.outputs.backend == 'true'
    outputs:
      cluster: ${{ steps.set-deploy-vars.outputs.cluster }}
      service: ${{ steps.set-deploy-vars.outputs.service }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set deployment variables
        id: set-deploy-vars
        run: |
          echo "cluster=wherewego-prod-cluster" >> $GITHUB_OUTPUT
          echo "service=wherewego-prod-service" >> $GITHUB_OUTPUT

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          role-session-name: GitHubActions-BackendDeploy
          aws-region: ${{ env.AWS_REGION }}

      - name: Notify backend deploy start
        run: |
          curl -X POST -H 'Content-type: application/json' \
          --data "{\"text\": \"🚀 *백엔드 배포 시작!* (병렬 처리)\"}" \
          ${{ secrets.SLACK_WEBHOOK }} || echo "Slack notification failed"

      - name: Deploy to ECS
        run: |
          # ECR URI를 태스크 정의에 반영
          sed "s|ECR_URI_PLACEHOLDER|${{ needs.build.outputs.image-uri }}|g" aws/task-definition.json > temp-task-definition.json
          
          # 태스크 정의 등록
          TASK_DEF_ARN=$(aws ecs register-task-definition --cli-input-json file://temp-task-definition.json --query 'taskDefinition.taskDefinitionArn' --output text)
          echo "✅ Task definition registered: $TASK_DEF_ARN"
          
          # 인프라 정보 가져오기
          INFRA_STACK_NAME="wherewego-prod-infrastructure"
          
          TARGET_GROUP_ARN=$(aws cloudformation describe-stacks \
            --stack-name "$INFRA_STACK_NAME" \
            --query 'Stacks[0].Outputs[?OutputKey==`ECSTargetGroupArn`].OutputValue' \
            --output text)
          
          PUBLIC_SUBNET1=$(aws cloudformation describe-stacks \
            --stack-name "$INFRA_STACK_NAME" \
            --query 'Stacks[0].Outputs[?OutputKey==`PublicSubnet1`].OutputValue' \
            --output text)
          
          PUBLIC_SUBNET2=$(aws cloudformation describe-stacks \
            --stack-name "$INFRA_STACK_NAME" \
            --query 'Stacks[0].Outputs[?OutputKey==`PublicSubnet2`].OutputValue' \
            --output text)
          
          PUBLIC_SUBNETS="$PUBLIC_SUBNET1,$PUBLIC_SUBNET2"
          
          ECS_SECURITY_GROUP=$(aws cloudformation describe-stacks \
            --stack-name "$INFRA_STACK_NAME" \
            --query 'Stacks[0].Outputs[?OutputKey==`ECSSecurityGroup`].OutputValue' \
            --output text)
          
          echo "🎯 Target Group ARN: $TARGET_GROUP_ARN"
          echo "🔒 Public Subnets: $PUBLIC_SUBNETS"
          echo "🛡️ ECS Security Group: $ECS_SECURITY_GROUP"
          
          # 서비스 업데이트
          aws ecs update-service \
            --cluster ${{ steps.set-deploy-vars.outputs.cluster }} \
            --service ${{ steps.set-deploy-vars.outputs.service }} \
            --task-definition "$TASK_DEF_ARN" \
            --force-new-deployment \
            --desired-count 1
          
          rm temp-task-definition.json

  frontend-deploy:
    runs-on: ubuntu-latest
    needs: [detect-changes, build]
    if: needs.detect-changes.outputs.frontend == 'true'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js for frontend deployment
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          role-session-name: GitHubActions-FrontendDeploy
          aws-region: ${{ env.AWS_REGION }}

      - name: Notify frontend deploy start
        run: |
          curl -X POST -H 'Content-type: application/json' \
          --data "{\"text\": \"🎨 *프론트엔드 배포 시작!* (병렬 처리)\"}" \
          ${{ secrets.SLACK_WEBHOOK }} || echo "Slack notification failed"

      - name: Deploy Frontend to S3
        run: |
          # Parameter Store에서 환경변수 가져오기
          S3_BUCKET=$(aws ssm get-parameter --name "/wherewego/aws/s3/frontend-bucket" --query 'Parameter.Value' --output text)
          IMAGE_S3_BUCKET=$(aws ssm get-parameter --name "/wherewego/aws/s3/images-bucket" --query 'Parameter.Value' --output text)
          AWS_DEFAULT_REGION=$(aws ssm get-parameter --name "/wherewego/aws/region" --query 'Parameter.Value' --output text)
          
          # 고정 ALB DNS 가져오기 - GitHub Secrets 사용 (보안)
          ALB_DNS="${{ secrets.ALB_DNS_NAME }}"
          
          echo "🌐 ALB DNS (고정): $ALB_DNS"
          
          # 환경변수 설정
          cd frontend
          npm ci
          
          KAKAO_CLIENT_ID=$(aws ssm get-parameter --name "/wherewego/kakao/client-id" --query 'Parameter.Value' --output text)
          GOOGLE_MAPS_API_KEY=$(aws ssm get-parameter --name "/wherewego/google/maps-api-key" --with-decryption --query 'Parameter.Value' --output text)
          GOOGLE_CLIENT_ID=$(aws ssm get-parameter --name "/wherewego/google/client-id" --query 'Parameter.Value' --output text)
          
          cat > .env.production << EOF
          VITE_API_BASE_URL=http://${ALB_DNS}/api
          VITE_IMAGE_BUCKET_URL=https://${IMAGE_S3_BUCKET}.s3.${AWS_DEFAULT_REGION}.amazonaws.com
          VITE_KAKAO_APP_KEY=${KAKAO_CLIENT_ID}
          VITE_GOOGLE_MAPS_API_KEY=${GOOGLE_MAPS_API_KEY}
          VITE_GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
          VITE_DEV_MODE=false
          VITE_LOG_LEVEL=warn
          EOF
          
          npm run build
          aws s3 sync dist/ s3://$S3_BUCKET --delete
          aws s3 website s3://$S3_BUCKET --index-document index.html --error-document index.html

  verify:
    runs-on: ubuntu-latest
    needs: [detect-changes, build, backend-deploy, frontend-deploy]
    if: always() && needs.detect-changes.outputs.any-changes == 'true'
    
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          role-session-name: GitHubActions-Verify
          aws-region: ${{ env.AWS_REGION }}

      - name: Wait for backend stability (if deployed)
        if: needs.backend-deploy.result == 'success'
        run: |
          echo "⏳ 백엔드 서비스 안정화 대기 중..."
          aws ecs wait services-stable \
            --cluster ${{ needs.backend-deploy.outputs.cluster }} \
            --services ${{ needs.backend-deploy.outputs.service }} \
            --cli-read-timeout 600 || echo "⚠️ 타임아웃이지만 서비스는 백그라운드에서 계속 진행됩니다"

      - name: Final notification
        run: |
          DEPLOY_RESULTS=""
          [[ "${{ needs.backend-deploy.result }}" == "success" ]] && DEPLOY_RESULTS="${DEPLOY_RESULTS}✅ Backend "
          [[ "${{ needs.backend-deploy.result }}" == "skipped" ]] && DEPLOY_RESULTS="${DEPLOY_RESULTS}⏭️ Backend "
          [[ "${{ needs.frontend-deploy.result }}" == "success" ]] && DEPLOY_RESULTS="${DEPLOY_RESULTS}✅ Frontend "
          [[ "${{ needs.frontend-deploy.result }}" == "skipped" ]] && DEPLOY_RESULTS="${DEPLOY_RESULTS}⏭️ Frontend "
          
          if [[ "${{ needs.backend-deploy.result }}" == "success" || "${{ needs.frontend-deploy.result }}" == "success" ]]; then
            COLOR="good"
            STATUS="✅ SUCCESS"
            MESSAGE="최적화된 배포가 완료되었습니다!"
          else
            COLOR="warning"
            STATUS="⏭️ SKIPPED"
            MESSAGE="변경사항이 없어 배포를 건너뛰었습니다."
          fi
          
          # ALB DNS 확인 (만약 인프라가 있다면)
          ALB_DNS=$(aws cloudformation describe-stacks \
            --stack-name "wherewego-prod-infrastructure" \
            --query 'Stacks[0].Outputs[?OutputKey==`ALBDNSName`].OutputValue' \
            --output text 2>/dev/null || echo "ALB DNS 조회 실패")
          
          FRONTEND_URL="http://wherewego-prod-frontend.s3-website.ap-northeast-2.amazonaws.com"
          BACKEND_URL="http://${ALB_DNS}/actuator/health"
          
          curl -X POST -H 'Content-type: application/json' \
          --data "{
            \"attachments\": [{
              \"color\": \"$COLOR\",
              \"blocks\": [{
                \"type\": \"section\",
                \"text\": {
                  \"type\": \"mrkdwn\",
                  \"text\": \"🚀 *WhereWeGo 최적화 배포* $STATUS\\\\n$MESSAGE\"
                }
              }, {
                \"type\": \"section\",
                \"fields\": [{
                  \"type\": \"mrkdwn\",
                  \"text\": \"*배포 결과:*\\\\n$DEPLOY_RESULTS\"
                }, {
                  \"type\": \"mrkdwn\",
                  \"text\": \"*브랜치:*\\\\n\`${{ github.ref_name }}\`\"
                }, {
                  \"type\": \"mrkdwn\",
                  \"text\": \"*프론트엔드:*\\\\n🌐 $FRONTEND_URL\"
                }, {
                  \"type\": \"mrkdwn\",
                  \"text\": \"*백엔드:*\\\\n⚙️ $BACKEND_URL\"
                }]
              }]
            }]
          }" ${{ secrets.SLACK_WEBHOOK }}

  no-changes:
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.any-changes == 'false'
    
    steps:
      - name: No changes notification
        run: |
          curl -X POST -H 'Content-type: application/json' \
          --data "{\"text\": \"⏭️ *WhereWeGo 배포 건너뛰기* 📋\\\\n변경사항이 없어 배포를 건너뛰었습니다.\"}" \
          ${{ secrets.SLACK_WEBHOOK }} || echo "Slack notification failed"