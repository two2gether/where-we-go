# ==============================
# Local Development Configuration
# ==============================
# ==============================
# Local Database Configuration
# ==============================
# Docker Compose MySQL을 사용 (포트 3307로 노출됨)
spring.datasource.url=jdbc:mysql://localhost:3306/test?useSSL=false&serverTimezone=Asia/Seoul&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=1234
# ==============================
# Local JPA Configuration
# ==============================
# For local development: recreate tables on each startup
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.use_sql_comments=true
# ==============================
# Local Logging Configuration
# ==============================
# Detailed logging for local development
logging.level.com.example.wherewego=DEBUG
logging.level.org.hibernate.SQL=DEBUG
# ==============================
# Local Cache Configuration
# ==============================
# Docker Redis 사용 가능 (로컬 개발 시 필요에 따라 none으로 변경)
spring.cache.type=redis
spring.data.redis.host=localhost
spring.data.redis.port=6379